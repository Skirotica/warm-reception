name = "warm-reception-hunter"
main = "worker.js"
compatibility_date = "2026-08-01"

# Privacy: do not add https://skirotica.github.io until Live is private
# (Cloudflare Access or partner sign-in). Hunter stays off on public Pages.
[vars]
ALLOWED_ORIGINS = "http://localhost:8765,http://127.0.0.1:8765"

# Secrets:
